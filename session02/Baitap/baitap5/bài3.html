<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <h1>Car Purchase Form</h1>
    <form action="">
<label for="username">Name:</label>
<input type="text" id="username"><br>
<label for="Email">Email:</label>
<input type="text" id="Email"><br>
<label for="number">Phone:</label>
<input type="number" id="number"><br>
<label for="Model of car">Chose a car</label>
<select>
    <option value="Model of car">Model 1</option>
    <option value="Model of car">Model 2</option>
    <option value="Model of car">Model 3</option>
    <option value="Model of car">Model 4</option>
    <option value="Model of car">Model 5</option>
</select><br>
<label>Chose a color</label>
<select>
    <option value="color">Red</option>
    <option value="color">Yellow</option>
    <option value="color">Black</option>
    <option value="color">White</option>
    <option value="color">Silver</option>
</select><br>
<label for="Quantity">Quantity</label>
<input type="number" name="Quantity" min="1" value="1"><br>
<label for="delivery date">Delivery date</label>
<input type="date" id="delivery date"><br>
<button>Submit</button>
     </form>  
</body>
</html>
