<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        input {
            width: 305px;
        }

        textarea {
            width: 305px;
        }

        button {
            width: 305px;
            background-color: rgb(74, 248, 74);
            color: white;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <form action="">
        <div>
            <label for="Họ Tên">Họ và tên:</label> <br>
            <input type="text" id="Họ Tên" />
        </div>
        <div>
            <label for="Email">Email:</label> <br>
            <input type="text" id="Email" />
        </div>
        <div>
            <label for="Tin nhắn">Tin nhắn:</label> <br>
            <textarea name="Tin nhắn" id="Tin nhắn"></textarea>
        </div>
        <div>
            <button>Gửi</button>
        </div>
    </form>
</body>

</html>
