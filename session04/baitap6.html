<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            max-width: 800px;
            margin: 0 center;
            padding: 20px;
            background-color: #f8e880;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 2em;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        button.read-more {
            display: inline-block;
            padding: 10px 20px;
            background-color: #82b7f3;
            /* Màu nền ban đầu của nút */
            color: #0e0808;
            font-size: 1.2em;
            border: none;
            border-radius: 5px;
        }

        button.read-more:hover {
            background-color: #08a047;
            color: #fff;

        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Trích dẫn nổi bật</h1>
        <p>
            "Kiến thức là sức mạnh."
        </p>
        <button class="read-more">Đọc thêm</button>
    </div>
</body>

</html>
